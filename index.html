<!doctype html>
<html lang="en-IN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kosh — Every rupee, accounted for.</title>
    <meta name="description" content="Kosh is a beautiful, private, offline-first expense tracker. Budgets, recurring bills, savings goals and insights — every rupee, accounted for." />
    <meta name="theme-color" content="#070b14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kosh" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kosh" />
    <meta property="og:title" content="Kosh — Every rupee, accounted for." />
    <meta property="og:description" content="A premium, private expense tracker for India. Budgets, subscriptions, goals and insights." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kosh — Every rupee, accounted for." />
    <meta name="twitter:description" content="A premium, private expense tracker for India." />
    <meta name="twitter:image" content="/og-image.png" />
    <script>
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('kosh:v1:settings') || '{}').theme || 'dark';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Kosh needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
